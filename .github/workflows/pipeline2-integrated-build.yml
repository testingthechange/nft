name: Pipeline 2 integrated build
on:
  push:
    branches:
      - pipeline2-complete-burn-cycle
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install and validate
        run: |
          npm ci
                    node --check server/pipeline2CompleteDiscountBurn.mjs
                    node --check server/pipeline2ConfirmedBurnRegistry.mjs
                    node --check server/index.mjs
                    npm run build
