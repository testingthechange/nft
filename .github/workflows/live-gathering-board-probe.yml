name: Live NFT Gathering Board six-slot receipt probe
on:
  pull_request:
    paths:
      - "scripts/probe-live-gathering-board.mjs"
      - ".github/workflows/live-gathering-board-probe.yml"
  workflow_dispatch:
jobs:
  board-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed NFT API projects six synthetic registration slots
        run: node scripts/probe-live-gathering-board.mjs
