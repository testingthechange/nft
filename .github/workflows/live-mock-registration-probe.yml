name: Live NFT mock JSON receipt probe
on:
  pull_request:
    paths:
      - "scripts/probe-live-mock-registration.mjs"
      - ".github/workflows/live-mock-registration-probe.yml"
  workflow_dispatch:
jobs:
  receipt-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send only synthetic registration JSON to deployed NFT API
        run: node scripts/probe-live-mock-registration.mjs
