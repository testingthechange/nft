name: NFT pipeline ping
on:
  pull_request:
    paths:
      - 'scripts/ping-nft-pipeline.mjs'
      - 'tests/nft-pipeline-ping.test.mjs'
      - '.github/workflows/nft-pipeline-ping.yml'
jobs:
  synthetic-ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/nft-pipeline-ping.test.mjs
