name: Registration JSON intake checks
on:
  pull_request:
    paths:
      - "server/**"
      - "tests/registrationIntakeHttp.test.mjs"
      - "tests/nftGatheringBoard.test.mjs"
      - "tests/albumRarityEngineFrame.test.mjs"
      - "tests/albumRarityLayerOneEvaluator.test.mjs"
      - "tests/albumRarityGatheringBoardConnection.test.mjs"
      - "tests/mockRegistrationGatheringBoard.test.mjs"
      - "tests/mockRegistrationJson.test.mjs"
      - "tests/nftRegistrationStore.test.mjs"
      - "tests/confirmedRegistrationContract.test.mjs"
      - ".github/workflows/registration-intake-tests.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "tests/registrationIntakeHttp.test.mjs"
      - "tests/nftGatheringBoard.test.mjs"
      - "tests/albumRarityEngineFrame.test.mjs"
      - "tests/albumRarityLayerOneEvaluator.test.mjs"
      - "tests/albumRarityGatheringBoardConnection.test.mjs"
      - "tests/mockRegistrationGatheringBoard.test.mjs"
      - "tests/mockRegistrationJson.test.mjs"
      - "tests/nftRegistrationStore.test.mjs"
      - "tests/confirmedRegistrationContract.test.mjs"
      - ".github/workflows/registration-intake-tests.yml"
jobs:
  registration-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Test JSON contract, Directus adapter and HTTP gates
        run: node --test tests/confirmedRegistrationContract.test.mjs tests/nftRegistrationStore.test.mjs tests/registrationIntakeHttp.test.mjs tests/mockRegistrationJson.test.mjs tests/nftGatheringBoard.test.mjs tests/mockRegistrationGatheringBoard.test.mjs tests/albumRarityEngineFrame.test.mjs tests/albumRarityGatheringBoardConnection.test.mjs tests/albumRarityLayerOneEvaluator.test.mjs
