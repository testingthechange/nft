name: Amoy provider verification
on:
  pull_request:
    paths:
      - 'scripts/inspect-amoy-provider.mjs'
      - 'tests/amoy-provider-inspection.test.mjs'
      - '.github/workflows/amoy-provider-verification.yml'
jobs:
  provider-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/amoy-provider-inspection.test.mjs
