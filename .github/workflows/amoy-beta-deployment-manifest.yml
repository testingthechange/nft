name: BETA unsigned deployment manifest checks
on:
  pull_request:
    paths:
      - 'scripts/prepare-amoy-beta-deployment.mjs'
      - 'tests/amoy-beta-deployment-manifest.test.mjs'
      - '.github/workflows/amoy-beta-deployment-manifest.yml'
jobs:
  manifest-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node tests/amoy-beta-deployment-manifest.test.mjs
      - run: npm run compile:nft:beta
