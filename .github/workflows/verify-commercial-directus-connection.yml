name: Verify commercial Directus connection (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AJINE_REGISTRATION_PREVIEW_TOKEN: ${{ secrets.AJINE_REGISTRATION_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check commercial Directus connectivity without registration approval
        run: node scripts/smoke-commercial-directus-connection.mjs
